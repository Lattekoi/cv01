<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="李艾橦个人简历" />
    <title>李艾橦 | 个人简历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">可可盖 / PORTFOLIO</div>
        <div class="nav">PRODUCT • DESIGN • CODE</div>
      </header>

      <div class="floating-cards">
        <article class="mini-card card-01">
          <div class="card-no">01</div>
          <div class="card-title">项目经历</div>
          <div class="card-sub">PROJECTS</div>
          <div class="barcode"></div>
        </article>

        <article class="mini-card card-02">
          <div class="card-no">02</div>
          <div class="card-title">实习经历</div>
          <div class="card-sub">EXPERIENCE</div>
          <div class="barcode"></div>
        </article>

        <article class="mini-card card-03">
          <div class="card-no">03</div>
          <div class="card-title">GitHub 项目</div>
          <div class="card-sub">OPEN SOURCE</div>
          <div class="barcode"></div>
        </article>

        <article class="mini-card card-04">
          <div class="card-no">04</div>
          <div class="card-title">奖项</div>
          <div class="card-sub">HONORS</div>
          <div class="barcode"></div>
        </article>
      </div>

      <main class="hero-layout">
        <section class="left-copy">
          <div class="title-block">
            <div class="name-cn">可可盖</div>
            <div class="name-en">ABOUT ME</div>
            <div class="name-cn">个人介绍</div>
          </div>
        </section>

        <section class="center-figure" aria-label="Portrait illustration">
          <div class="create-word">CREATE</div>
          <div class="portrait">
            <div class="hair"></div>
            <div class="head">
              <div class="face-glow"></div>
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="nose"></div>
              <div class="mouth"></div>
            </div>
            <div class="neck"></div>
            <div class="body">
              <div class="collar"></div>
              <div class="arm left"></div>
              <div class="arm right"></div>
            </div>
          </div>
        </section>

        <aside class="right-copy">
          <ul>
            <li>爱好</li>
            <li>看电影</li>
            <li>看书</li>
            <li>探索新工具</li>
          </ul>
          <div class="quote">
            <span>Stay curious.</span>
            <small>MAKE THINGS HAPPEN.</small>
          </div>
        </aside>
      </main>

      <footer class="bottombar">
        <div class="archive">可可盖 • PERSONAL ARCHIVE</div>
        <div class="reality">IDEAS INTO REALITY</div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
